spring.application.name=gyeol

# studyFinal 사이트 API. 진도 실습 demo 는 8080, 이 서버는 8082.
server.port=8082

# SQLite (파일 기반 DB. 서버를 껐다 켜도 데이터가 유지됨)
spring.datasource.url=jdbc:sqlite:data.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (실습용 시크릿 키. 실제 서비스에서는 환경변수 등 외부에서 주입해야 함)
jwt.secret=hL1943sr4X27M8toMX+FNilwsf21cZRCXQqNGMHiUrY=
jwt.expiration=3600000

# 파일 업로드
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# springdoc (API 문서화)
springdoc.swagger-ui.path=/swagger-ui.html
