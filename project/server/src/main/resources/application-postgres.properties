# postgres 프로파일. 기본 실행은 application.properties 의 SQLite 를 쓴다.
# demo 와 포트가 겹치지 않게 호스트 5433, DB 이름 gyeol 을 쓴다.
# docker compose up -d
# .\gradlew.bat bootRun --args="--spring.profiles.active=postgres"
spring.datasource.url=jdbc:postgresql://localhost:5433/gyeol
spring.datasource.username=spring
spring.datasource.password=spring
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
