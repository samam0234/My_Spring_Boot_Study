<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study7 - 로그인 & 쪽지</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: "Malgun Gothic", sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        background: #f5f6f8;
        color: #222;
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p.desc { color: #666; margin-top: 0; margin-bottom: 24px; }

    section {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 24px;
    }
    h2 { font-size: 16px; margin-top: 0; }

    label { display: block; font-size: 13px; color: #555; margin-top: 10px; margin-bottom: 4px; }
    input, textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
    }
    textarea { resize: vertical; min-height: 60px; }

    button {
        margin-top: 14px;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        background: #2f6feb;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
    }
    button.secondary { background: #6b7280; }
    button.danger { background: #d64545; }
    button:hover { opacity: 0.9; }
    button:disabled { background: #b9c2d0; cursor: not-allowed; }

    #errorBox {
        display: none;
        background: #fdecea;
        border: 1px solid #f5c2c0;
        color: #a12b2b;
        padding: 10px 14px;
        border-radius: 6px;
        margin-bottom: 16px;
        font-size: 13px;
    }

    .account-forms { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .account-forms h3 { font-size: 14px; margin: 0 0 4px; }

    #loggedInBar {
        display: none;
        align-items: center;
        justify-content: space-between;
        background: #eef4ff;
        border: 1px solid #cfe0ff;
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 14px;
    }
    #loggedInBar button { margin-top: 0; }

    #messageSections { display: none; }

    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tabs button { margin-top: 0; background: #e5e7eb; color: #333; }
    .tabs button.active { background: #2f6feb; color: #fff; }

    ul.msg-list { list-style: none; padding: 0; margin: 0; }
    ul.msg-list li {
        padding: 10px 4px;
        border-bottom: 1px solid #eee;
        font-size: 14px;
    }
    .msg-from { font-weight: bold; }
    .msg-meta { font-size: 12px; color: #888; }
    .empty { color: #999; font-size: 13px; padding: 12px 4px; }

    .conversation-row { display: flex; margin-bottom: 6px; }
    .conversation-row.mine { justify-content: flex-end; }
    .bubble {
        max-width: 70%;
        padding: 8px 12px;
        border-radius: 12px;
        background: #e5e7eb;
        font-size: 14px;
    }
    .conversation-row.mine .bubble { background: #2f6feb; color: #fff; }
    .bubble .time { display: block; font-size: 10px; opacity: 0.7; margin-top: 4px; }
</style>
</head>
<body>

<h1>로그인 &amp; 쪽지</h1>
<p class="desc">study7 — 회원가입/로그인으로 JWT 토큰을 발급받고, 그 토큰으로 로그인한 사용자끼리 쪽지(<code>/messages</code>)를 주고받습니다.</p>

<div id="errorBox"></div>

<section id="accountSection">
    <h2>계정</h2>

    <div id="loggedInBar">
        <span><strong id="meUsername"></strong> 님으로 로그인됨</span>
        <button type="button" class="secondary" id="logoutBtn">로그아웃</button>
    </div>

    <div id="authForms" class="account-forms">
        <div>
            <h3>회원가입</h3>
            <form id="signupForm">
                <label for="signupUsername">아이디</label>
                <input type="text" id="signupUsername" required>
                <label for="signupPassword">비밀번호</label>
                <input type="password" id="signupPassword" required>
                <button type="submit">가입하기</button>
            </form>
        </div>
        <div>
            <h3>로그인</h3>
            <form id="loginForm">
                <label for="loginUsername">아이디</label>
                <input type="text" id="loginUsername" required>
                <label for="loginPassword">비밀번호</label>
                <input type="password" id="loginPassword" required>
                <button type="submit">로그인</button>
            </form>
        </div>
    </div>
</section>

<div id="messageSections">
    <section>
        <h2>쪽지 보내기</h2>
        <form id="sendForm">
            <label for="receiverUsername">받는 사람 아이디</label>
            <input type="text" id="receiverUsername" required>
            <label for="messageContent">내용</label>
            <textarea id="messageContent" required></textarea>
            <button type="submit">보내기</button>
        </form>
    </section>

    <section>
        <h2>쪽지함</h2>
        <div class="tabs">
            <button type="button" id="inboxTabBtn" class="active">받은 쪽지함</button>
            <button type="button" id="sentTabBtn">보낸 쪽지함</button>
        </div>
        <ul class="msg-list" id="mailboxList"></ul>
    </section>

    <section>
        <h2>대화 보기</h2>
        <label for="conversationUsername">상대방 아이디</label>
        <input type="text" id="conversationUsername" placeholder="예: younghee">
        <button type="button" id="loadConversationBtn">대화 불러오기</button>
        <div id="conversationView" style="margin-top:16px;"></div>
    </section>
</div>

<script>
    const errorBox = document.getElementById("errorBox");

    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
    }
    function clearError() {
        errorBox.style.display = "none";
        errorBox.textContent = "";
    }
    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text ?? "";
        return div.innerHTML;
    }
    function formatDate(isoString) {
        if (!isoString) return "";
        return new Date(isoString).toLocaleString("ko-KR");
    }

    // ---- 인증 상태 관리 ----
    function getToken() { return localStorage.getItem("token"); }
    function getUsername() { return localStorage.getItem("username"); }

    function saveSession(token, username) {
        localStorage.setItem("token", token);
        localStorage.setItem("username", username);
    }
    function clearSession() {
        localStorage.removeItem("token");
        localStorage.removeItem("username");
    }

    function refreshAuthUi() {
        const token = getToken();
        const username = getUsername();

        if (token && username) {
            document.getElementById("loggedInBar").style.display = "flex";
            document.getElementById("authForms").style.display = "none";
            document.getElementById("meUsername").textContent = username;
            document.getElementById("messageSections").style.display = "block";
        } else {
            document.getElementById("loggedInBar").style.display = "none";
            document.getElementById("authForms").style.display = "grid";
            document.getElementById("messageSections").style.display = "none";
        }
    }

    // ---- 공통 API 호출 ----
    async function api(path, options = {}, auth = false) {
        const headers = Object.assign({}, options.headers || {});
        if (auth) {
            const token = getToken();
            if (!token) throw new Error("로그인이 필요합니다.");
            headers["Authorization"] = "Bearer " + token;
        }

        const response = await fetch(path, Object.assign({}, options, { headers }));

        if (response.status === 403 && auth) {
            clearSession();
            refreshAuthUi();
            throw new Error("로그인이 만료되었거나 유효하지 않습니다. 다시 로그인해주세요.");
        }

        const isJson = response.headers.get("content-type")?.includes("application/json");
        const body = isJson ? await response.json() : null;

        if (!response.ok) {
            const message = body && body.message ? body.message : `요청 실패 (HTTP ${response.status})`;
            throw new Error(message);
        }
        return body;
    }

    // ---- 회원가입 / 로그인 ----
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        clearError();
        const username = document.getElementById("signupUsername").value;
        const password = document.getElementById("signupPassword").value;

        try {
            await api("/auth/signup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            alert("회원가입이 완료되었습니다. 로그인해주세요.");
            e.target.reset();
        } catch (err) {
            showError(err.message);
        }
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        clearError();
        const username = document.getElementById("loginUsername").value;
        const password = document.getElementById("loginPassword").value;

        try {
            const result = await api("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            saveSession(result.token, username);
            e.target.reset();
            refreshAuthUi();
            await loadMailbox();
        } catch (err) {
            showError(err.message);
        }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
        clearSession();
        refreshAuthUi();
    });

    // ---- 쪽지 보내기 ----
    document.getElementById("sendForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        clearError();
        const receiverUsername = document.getElementById("receiverUsername").value;
        const content = document.getElementById("messageContent").value;

        try {
            await api("/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ receiverUsername, content })
            }, true);
            e.target.reset();
            await loadMailbox();
        } catch (err) {
            showError(err.message);
        }
    });

    // ---- 받은/보낸 쪽지함 ----
    let currentTab = "inbox";

    document.getElementById("inboxTabBtn").addEventListener("click", () => switchTab("inbox"));
    document.getElementById("sentTabBtn").addEventListener("click", () => switchTab("sent"));

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById("inboxTabBtn").classList.toggle("active", tab === "inbox");
        document.getElementById("sentTabBtn").classList.toggle("active", tab === "sent");
        loadMailbox();
    }

    async function loadMailbox() {
        if (!getToken()) return;
        clearError();
        try {
            const messages = await api(`/messages/${currentTab}`, { method: "GET" }, true);
            renderMailbox(messages);
        } catch (err) {
            showError(err.message);
        }
    }

    function renderMailbox(messages) {
        const list = document.getElementById("mailboxList");
        list.innerHTML = "";

        if (messages.length === 0) {
            list.innerHTML = '<li class="empty">쪽지가 없습니다.</li>';
            return;
        }

        messages.forEach((m) => {
            const counterpart = currentTab === "inbox" ? m.senderUsername : m.receiverUsername;
            const label = currentTab === "inbox" ? "보낸 사람" : "받는 사람";
            const li = document.createElement("li");
            li.innerHTML = `
                <div class="msg-from">${label}: ${escapeHtml(counterpart)}</div>
                <div>${escapeHtml(m.content)}</div>
                <div class="msg-meta">${formatDate(m.createdAt)}</div>
            `;
            list.appendChild(li);
        });
    }

    // ---- 대화 보기 ----
    document.getElementById("loadConversationBtn").addEventListener("click", async () => {
        clearError();
        const other = document.getElementById("conversationUsername").value.trim();
        if (!other) {
            showError("상대방 아이디를 입력해주세요.");
            return;
        }

        try {
            const messages = await api(`/messages/conversation/${encodeURIComponent(other)}`, { method: "GET" }, true);
            renderConversation(messages);
        } catch (err) {
            showError(err.message);
        }
    });

    function renderConversation(messages) {
        const view = document.getElementById("conversationView");
        view.innerHTML = "";
        const me = getUsername();

        if (messages.length === 0) {
            view.innerHTML = '<div class="empty">대화 내역이 없습니다.</div>';
            return;
        }

        messages.forEach((m) => {
            const mine = m.senderUsername === me;
            const row = document.createElement("div");
            row.className = "conversation-row" + (mine ? " mine" : "");
            row.innerHTML = `
                <div class="bubble">
                    ${escapeHtml(m.content)}
                    <span class="time">${escapeHtml(m.senderUsername)} · ${formatDate(m.createdAt)}</span>
                </div>
            `;
            view.appendChild(row);
        });
    }

    // ---- 초기화 ----
    refreshAuthUi();
    if (getToken()) {
        loadMailbox();
    }
</script>

</body>
</html>
